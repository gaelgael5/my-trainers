<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyCoach - Login Coach Orange V2 Néon</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ORANGE FLASHY PALETTE V2 - NÉON PREMIUM */
        :root {
            --orange-neon-primary: #FF5722;
            --orange-neon-hover: #FF7043;
            --orange-neon-pressed: #E64A19;
            --orange-flashy: #FF4500;
            --orange-bright: #FF6B35;
            --orange-electric: #FF8C42;
            --orange-premium: #FF9800;
            --orange-gold: #F57F17;
            
            --orange-glow-intense: rgba(255, 87, 34, 0.8);
            --orange-glow-neon: rgba(255, 87, 34, 0.5);
            --orange-glow-subtle: rgba(255, 87, 34, 0.2);
            
            --coach-background-primary: #0A0E1A;
            --coach-background-secondary: #1A1F2E;
            --coach-background-tertiary: #2A2F3E;
            --coach-text-primary: #FFFFFF;
            --coach-text-secondary: #B8C4D6;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: linear-gradient(135deg, var(--coach-background-primary) 0%, var(--coach-background-secondary) 50%, var(--coach-background-tertiary) 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--coach-text-primary);
            position: relative;
        }

        /* Background Pattern avec Orange Néon Intense */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 80%, var(--orange-glow-subtle) 0%, transparent 60%),
                radial-gradient(circle at 80% 20%, var(--orange-glow-subtle) 0%, transparent 60%),
                radial-gradient(circle at 50% 50%, rgba(255, 87, 34, 0.03) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        .mobile-container {
            position: relative;
            z-index: 1;
            width: 375px;
            min-height: 812px;
            padding: 60px 32px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Header Section */
        .header {
            text-align: center;
            margin-bottom: 60px;
        }

        .logo-container {
            margin-bottom: 32px;
            position: relative;
        }

        /* Logo avec effet néon renforcé */
        .logo {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, var(--orange-neon-primary), var(--orange-bright), var(--orange-electric));
            border-radius: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            font-size: 40px;
            font-weight: 700;
            box-shadow: 
                0 0 40px var(--orange-glow-neon),
                0 0 80px var(--orange-glow-subtle),
                inset 0 0 20px rgba(255, 255, 255, 0.1);
            animation: neon-pulse 2s ease-in-out infinite alternate;
            position: relative;
        }

        .logo::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 36px;
            background: linear-gradient(45deg, var(--orange-neon-primary), transparent, var(--orange-electric));
            z-index: -1;
            opacity: 0.6;
            animation: neon-rotate 4s linear infinite;
        }

        @keyframes neon-pulse {
            from { 
                box-shadow: 
                    0 0 30px var(--orange-glow-neon),
                    0 0 60px var(--orange-glow-subtle),
                    inset 0 0 20px rgba(255, 255, 255, 0.1);
            }
            to { 
                box-shadow: 
                    0 0 60px var(--orange-glow-intense),
                    0 0 120px var(--orange-glow-neon),
                    inset 0 0 30px rgba(255, 255, 255, 0.2);
            }
        }

        @keyframes neon-rotate {
            to { transform: rotate(360deg); }
        }

        .welcome-text {
            margin-top: 24px;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #FFFFFF 0%, var(--orange-neon-primary) 50%, var(--orange-electric) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px var(--orange-glow-subtle);
        }

        .subtitle {
            font-size: 16px;
            color: var(--coach-text-secondary);
            font-weight: 400;
        }

        .professional-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, rgba(255, 87, 34, 0.2), rgba(255, 140, 66, 0.1));
            border: 1px solid var(--orange-neon-primary);
            padding: 8px 16px;
            border-radius: 20px;
            margin-top: 16px;
            font-size: 12px;
            color: var(--orange-neon-primary);
            font-weight: 600;
            box-shadow: 0 0 20px var(--orange-glow-subtle);
            animation: badge-glow 3s ease-in-out infinite;
        }

        @keyframes badge-glow {
            0%, 100% { box-shadow: 0 0 10px var(--orange-glow-subtle); }
            50% { box-shadow: 0 0 25px var(--orange-glow-neon); }
        }

        /* Login Form */
        .login-form {
            width: 100%;
            max-width: 320px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .input-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--orange-neon-primary);
            margin-bottom: 8px;
            text-shadow: 0 0 10px var(--orange-glow-subtle);
        }

        .input-container {
            position: relative;
        }

        .form-input {
            width: 100%;
            background: rgba(255, 87, 34, 0.12);
            border: 1px solid var(--orange-neon-primary);
            border-radius: 16px;
            padding: 16px 20px;
            font-size: 16px;
            color: var(--coach-text-primary);
            font-family: 'Space Grotesk', sans-serif;
            backdrop-filter: blur(20px);
            transition: all 0.3s ease;
            box-shadow: 0 0 20px var(--orange-glow-subtle);
        }

        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--orange-neon-hover);
            box-shadow: 
                0 0 0 3px var(--orange-glow-subtle),
                0 0 30px var(--orange-glow-neon);
            background: rgba(255, 87, 34, 0.15);
        }

        .password-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--orange-neon-primary);
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
            transition: all 0.3s ease;
            text-shadow: 0 0 10px var(--orange-glow-subtle);
        }

        .password-toggle:hover {
            color: var(--orange-neon-hover);
            text-shadow: 0 0 15px var(--orange-glow-neon);
        }

        /* Remember & Forgot */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .remember-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox {
            width: 18px;
            height: 18px;
            border: 2px solid var(--orange-neon-primary);
            border-radius: 4px;
            background: transparent;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .checkbox:checked {
            background: var(--orange-neon-primary);
            border-color: var(--orange-neon-primary);
            box-shadow: 0 0 15px var(--orange-glow-neon);
        }

        .checkbox-label {
            font-size: 14px;
            color: var(--coach-text-secondary);
            cursor: pointer;
        }

        .forgot-link {
            font-size: 14px;
            color: var(--orange-neon-primary);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            text-shadow: 0 0 10px var(--orange-glow-subtle);
        }

        .forgot-link:hover {
            color: var(--orange-neon-hover);
            text-decoration: underline;
            text-shadow: 0 0 15px var(--orange-glow-neon);
        }

        /* Button Principal avec Néon Intense */
        .login-button {
            width: 100%;
            background: linear-gradient(135deg, var(--orange-neon-primary) 0%, var(--orange-bright) 50%, var(--orange-electric) 100%);
            border: none;
            border-radius: 16px;
            padding: 18px;
            font-size: 16px;
            font-weight: 700;
            color: var(--coach-text-primary);
            cursor: pointer;
            transition: all 0.4s ease;
            margin-bottom: 20px;
            font-family: 'Space Grotesk', sans-serif;
            box-shadow: 
                0 0 40px var(--orange-glow-neon),
                0 0 80px var(--orange-glow-subtle);
            position: relative;
            overflow: hidden;
        }

        .login-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.6s ease;
        }

        .login-button:hover::before {
            left: 100%;
        }

        .login-button:hover {
            transform: translateY(-3px);
            box-shadow: 
                0 12px 50px var(--orange-glow-intense),
                0 0 100px var(--orange-glow-neon);
        }

        .login-button:active {
            transform: scale(0.98) translateY(-1px);
        }

        /* Social Login avec accents orange */
        .divider {
            display: flex;
            align-items: center;
            margin: 32px 0;
            color: #6B7280;
            font-size: 14px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--orange-neon-primary), transparent);
        }

        .divider span {
            padding: 0 16px;
        }

        .social-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
        }

        .social-button {
            flex: 1;
            background: rgba(255, 87, 34, 0.08);
            border: 1px solid var(--orange-neon-primary);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(20px);
        }

        .social-button:hover {
            background: rgba(255, 87, 34, 0.15);
            border-color: var(--orange-neon-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--orange-glow-subtle);
        }

        /* Features avec icônes néon */
        .features-list {
            margin-top: 40px;
            text-align: left;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            font-size: 14px;
            color: var(--coach-text-secondary);
        }

        .feature-icon {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, var(--orange-neon-primary), var(--orange-electric));
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #FFFFFF;
            box-shadow: 0 0 15px var(--orange-glow-subtle);
            animation: feature-glow 4s ease-in-out infinite;
        }

        @keyframes feature-glow {
            0%, 100% { box-shadow: 0 0 10px var(--orange-glow-subtle); }
            50% { box-shadow: 0 0 20px var(--orange-glow-neon); }
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 40px;
        }

        .register-link {
            color: var(--coach-text-secondary);
            font-size: 14px;
        }

        .register-link a {
            color: var(--orange-neon-primary);
            text-decoration: none;
            font-weight: 600;
            text-shadow: 0 0 10px var(--orange-glow-subtle);
        }

        .register-link a:hover {
            text-decoration: underline;
            color: var(--orange-neon-hover);
            text-shadow: 0 0 15px var(--orange-glow-neon);
        }
    </style>
</head>
<body>
    <div class="mobile-container">
        <!-- Header -->
        <div class="header">
            <div class="logo-container">
                <div class="logo">MC</div>
            </div>
            
            <div class="welcome-text">
                <h1 class="title">Espace Coach</h1>
                <p class="subtitle">Interface professionnelle de gestion</p>
                <div class="professional-badge">
                    <span>⚡</span>
                    <span>Compte Professionnel</span>
                </div>
            </div>
        </div>

        <!-- Login Form -->
        <form class="login-form">
            <div class="form-group">
                <label class="input-label">Email professionnel</label>
                <div class="input-container">
                    <input 
                        type="email" 
                        class="form-input" 
                        placeholder="thomas@coach-example.com"
                        value="thomas@coach-example.com"
                    />
                </div>
            </div>

            <div class="form-group">
                <label class="input-label">Mot de passe</label>
                <div class="input-container">
                    <input 
                        type="password" 
                        class="form-input" 
                        placeholder="••••••••"
                    />
                    <button type="button" class="password-toggle">👁</button>
                </div>
            </div>

            <div class="form-options">
                <div class="remember-container">
                    <input type="checkbox" class="checkbox" id="remember" checked />
                    <label class="checkbox-label" for="remember">Se souvenir</label>
                </div>
                <a href="#" class="forgot-link">Mot de passe oublié ?</a>
            </div>

            <button type="submit" class="login-button">
                <span>Accéder au tableau de bord</span>
            </button>

            <div class="divider">
                <span>ou continuer avec</span>
            </div>

            <div class="social-buttons">
                <button class="social-button">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                </button>
                
                <button class="social-button">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="#1877F2">
                        <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                    </svg>
                </button>

                <button class="social-button">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="#000">
                        <path d="M12 0C5.374 0 0 5.373 0 12s5.374 12 12 12 12-5.373 12-12S18.626 0 12 0zm5.568 8.16c-.169 1.858-.896 3.646-2.082 5.062-1.188 1.416-2.778 2.536-4.518 3.18-1.742.643-3.627.816-5.463.49.85.634 1.808 1.065 2.822 1.065 1.063 0 2.066-.426 2.773-1.179.707-.753 1.098-1.774 1.083-2.838-.016-1.063-.439-2.073-1.172-2.804-.733-.731-1.745-1.14-2.808-1.14-.618 0-1.224.142-1.777.414.083-.924.429-1.817.999-2.557.569-.74 1.344-1.288 2.213-1.566.868-.279 1.796-.272 2.661.02.866.292 1.635.832 2.203 1.546z"/>
                    </svg>
                </button>
            </div>
        </form>

        <!-- Professional Features -->
        <div class="features-list">
            <div class="feature-item">
                <div class="feature-icon">👥</div>
                <span>Gestion avancée des clients</span>
            </div>
            <div class="feature-item">
                <div class="feature-icon">📊</div>
                <span>Analytics et reporting détaillés</span>
            </div>
            <div class="feature-item">
                <div class="feature-icon">💰</div>
                <span>Facturation et paiements</span>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <p class="register-link">
                Pas encore de compte professionnel ?
                <a href="#">Demander un accès</a>
            </p>
        </div>
    </div>
</body>
</html>
