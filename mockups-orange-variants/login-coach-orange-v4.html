<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyCoach - Login Coach Orange V4 Gradient Sophistiqué</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ORANGE FLASHY PALETTE V4 - GRADIENT SOPHISTIQUÉ */
        :root {
            /* Orange Gradient Sophistiqué */
            --orange-primary-gradient: linear-gradient(135deg, #FF4500 0%, #FF6B35 25%, #FF5722 50%, #FF8C42 75%, #FFB74D 100%);
            --orange-secondary-gradient: linear-gradient(45deg, #FF7043 0%, #FF9800 50%, #F57F17 100%);
            --orange-tertiary-gradient: linear-gradient(225deg, #FF5722 0%, #FF4500 100%);
            
            /* Orange Glassmorphism */
            --orange-glass-primary: rgba(255, 69, 0, 0.15);
            --orange-glass-secondary: rgba(255, 87, 34, 0.12);
            --orange-glass-tertiary: rgba(255, 140, 66, 0.08);
            --orange-glass-border: rgba(255, 87, 34, 0.3);
            
            /* Orange Glow Sophistiqué */
            --orange-glow-premium: 0 0 60px rgba(255, 69, 0, 0.6), 0 0 120px rgba(255, 87, 34, 0.3);
            --orange-glow-elegant: 0 0 40px rgba(255, 87, 34, 0.5), 0 0 80px rgba(255, 140, 66, 0.2);
            --orange-glow-subtle: 0 0 20px rgba(255, 69, 0, 0.3);
            
            /* Advanced Orange Shadows */
            --orange-shadow-soft: 0 8px 32px rgba(255, 69, 0, 0.2);
            --orange-shadow-medium: 0 12px 48px rgba(255, 87, 34, 0.25);
            --orange-shadow-strong: 0 16px 64px rgba(255, 69, 0, 0.3);
            
            /* Base Colors */
            --coach-background-primary: #0A0E1A;
            --coach-background-secondary: #1A1F2E;
            --coach-background-tertiary: #2A2F3E;
            --coach-text-primary: #FFFFFF;
            --coach-text-secondary: #B8C4D6;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: 
                radial-gradient(circle at 25% 25%, rgba(255, 69, 0, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, rgba(255, 87, 34, 0.06) 0%, transparent 50%),
                linear-gradient(135deg, 
                    var(--coach-background-primary) 0%, 
                    var(--coach-background-secondary) 40%,
                    var(--coach-background-tertiary) 70%,
                    #1E293B 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--coach-text-primary);
            position: relative;
            overflow-x: hidden;
        }

        /* Sophisticated Background Effects */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                conic-gradient(from 0deg at 20% 30%, transparent 0deg, rgba(255, 69, 0, 0.05) 60deg, transparent 120deg),
                conic-gradient(from 180deg at 80% 70%, transparent 0deg, rgba(255, 87, 34, 0.03) 45deg, transparent 90deg);
            pointer-events: none;
            z-index: 0;
            animation: gradient-flow 15s linear infinite;
        }

        @keyframes gradient-flow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .mobile-container {
            position: relative;
            z-index: 1;
            width: 375px;
            min-height: 812px;
            padding: 60px 32px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--orange-glass-tertiary);
            border-radius: 32px;
            backdrop-filter: blur(40px) saturate(180%);
            border: 1px solid var(--orange-glass-border);
            box-shadow: var(--orange-shadow-soft);
        }

        /* Header Section */
        .header {
            text-align: center;
            margin-bottom: 60px;
            position: relative;
        }

        .logo-container {
            margin-bottom: 32px;
            position: relative;
        }

        /* Logo Glassmorphism Sophistiqué */
        .logo {
            width: 110px;
            height: 110px;
            background: var(--orange-primary-gradient);
            border-radius: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            font-size: 44px;
            font-weight: 800;
            box-shadow: var(--orange-glow-premium);
            animation: logo-sophisticated 4s ease-in-out infinite;
            position: relative;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .logo::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 38px;
            background: conic-gradient(from 45deg, #FF4500, #FF6B35, #FF5722, #FF8C42, #FFB74D, #FF4500);
            z-index: -1;
            opacity: 0.7;
            animation: logo-border-flow 8s linear infinite;
        }

        .logo::after {
            content: '';
            position: absolute;
            inset: 15px;
            border-radius: 21px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2) 0%, transparent 50%, rgba(255, 255, 255, 0.1) 100%);
            pointer-events: none;
        }

        @keyframes logo-sophisticated {
            0%, 100% { 
                transform: scale(1) rotate(0deg);
                box-shadow: var(--orange-glow-premium);
            }
            25% { 
                transform: scale(1.02) rotate(1deg);
                box-shadow: var(--orange-glow-elegant);
            }
            50% { 
                transform: scale(1.03) rotate(0deg);
                box-shadow: 
                    0 0 80px rgba(255, 69, 0, 0.8), 
                    0 0 160px rgba(255, 87, 34, 0.4),
                    0 0 240px rgba(255, 140, 66, 0.2);
            }
            75% { 
                transform: scale(1.02) rotate(-1deg);
                box-shadow: var(--orange-glow-elegant);
            }
        }

        @keyframes logo-border-flow {
            to { transform: rotate(360deg); }
        }

        .welcome-text {
            margin-top: 24px;
        }

        .title {
            font-size: 30px;
            font-weight: 800;
            margin-bottom: 8px;
            background: var(--orange-primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 30px rgba(255, 69, 0, 0.4));
            animation: title-sophisticated 6s ease-in-out infinite;
        }

        @keyframes title-sophisticated {
            0%, 100% { filter: drop-shadow(0 0 20px rgba(255, 69, 0, 0.3)); }
            50% { filter: drop-shadow(0 0 40px rgba(255, 87, 34, 0.6)); }
        }

        .subtitle {
            font-size: 16px;
            color: var(--coach-text-secondary);
            font-weight: 500;
        }

        .professional-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: var(--orange-glass-primary);
            border: 1px solid var(--orange-glass-border);
            padding: 12px 20px;
            border-radius: 30px;
            margin-top: 16px;
            font-size: 13px;
            color: #FF6B35;
            font-weight: 700;
            box-shadow: var(--orange-shadow-soft);
            backdrop-filter: blur(30px) saturate(150%);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            animation: badge-sophisticated 5s ease-in-out infinite;
        }

        @keyframes badge-sophisticated {
            0%, 100% { 
                transform: scale(1);
                box-shadow: var(--orange-shadow-soft);
            }
            50% { 
                transform: scale(1.01);
                box-shadow: var(--orange-shadow-medium);
            }
        }

        /* Login Form Glassmorphism */
        .login-form {
            width: 100%;
            max-width: 320px;
            background: var(--orange-glass-primary);
            padding: 36px;
            border-radius: 28px;
            border: 1px solid var(--orange-glass-border);
            backdrop-filter: blur(50px) saturate(200%);
            box-shadow: var(--orange-shadow-medium);
        }

        .form-group {
            margin-bottom: 26px;
        }

        .input-label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            background: var(--orange-secondary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
        }

        .input-container {
            position: relative;
        }

        .form-input {
            width: 100%;
            background: var(--orange-glass-secondary);
            border: 1px solid var(--orange-glass-border);
            border-radius: 20px;
            padding: 18px 24px;
            font-size: 16px;
            color: var(--coach-text-primary);
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 500;
            backdrop-filter: blur(40px) saturate(180%);
            transition: all 0.4s ease;
            box-shadow: var(--orange-glow-subtle);
        }

        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
            font-weight: 400;
        }

        .form-input:focus {
            outline: none;
            border-color: #FF6B35;
            background: var(--orange-glass-primary);
            box-shadow: 
                0 0 0 3px rgba(255, 107, 53, 0.2),
                var(--orange-glow-elegant);
            transform: translateY(-1px) scale(1.01);
        }

        .password-toggle {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            background: var(--orange-secondary-gradient);
            border: none;
            color: #FFFFFF;
            font-size: 16px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: all 0.3s ease;
            box-shadow: var(--orange-glow-subtle);
            backdrop-filter: blur(10px);
        }

        .password-toggle:hover {
            transform: translateY(-50%) scale(1.1);
            box-shadow: var(--orange-glow-elegant);
        }

        /* Form Options Sophistiqué */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .remember-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid #FF6B35;
            border-radius: 6px;
            background: transparent;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .checkbox:checked {
            background: var(--orange-secondary-gradient);
            border-color: #FF8C42;
            box-shadow: var(--orange-glow-subtle);
        }

        .checkbox-label {
            font-size: 14px;
            color: var(--coach-text-secondary);
            cursor: pointer;
            font-weight: 500;
        }

        .forgot-link {
            font-size: 14px;
            background: var(--orange-secondary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .forgot-link:hover {
            text-decoration: underline;
            filter: drop-shadow(0 0 10px rgba(255, 107, 53, 0.5));
            transform: scale(1.02);
        }

        /* Button Gradient Sophistiqué */
        .login-button {
            width: 100%;
            background: var(--orange-primary-gradient);
            border: none;
            border-radius: 24px;
            padding: 20px;
            font-size: 17px;
            font-weight: 800;
            color: var(--coach-text-primary);
            cursor: pointer;
            transition: all 0.5s ease;
            margin-bottom: 24px;
            font-family: 'Space Grotesk', sans-serif;
            box-shadow: var(--orange-shadow-medium);
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 1px;
            backdrop-filter: blur(10px);
        }

        .login-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 1s ease;
        }

        .login-button::after {
            content: '';
            position: absolute;
            inset: 1px;
            border-radius: 23px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), transparent, rgba(255, 255, 255, 0.1));
            pointer-events: none;
        }

        .login-button:hover::before {
            left: 100%;
        }

        .login-button:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow: var(--orange-shadow-strong);
        }

        .login-button:active {
            transform: scale(0.99) translateY(-1px);
        }

        /* Social Glassmorphism */
        .divider {
            display: flex;
            align-items: center;
            margin: 32px 0;
            color: var(--coach-text-secondary);
            font-size: 14px;
            font-weight: 600;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--orange-secondary-gradient);
            box-shadow: 0 0 10px rgba(255, 87, 34, 0.3);
        }

        .divider span {
            padding: 0 20px;
            background: var(--orange-glass-tertiary);
            border-radius: 20px;
            border: 1px solid var(--orange-glass-border);
            backdrop-filter: blur(20px);
        }

        .social-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
        }

        .social-button {
            flex: 1;
            background: var(--orange-glass-secondary);
            border: 1px solid var(--orange-glass-border);
            border-radius: 18px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.4s ease;
            backdrop-filter: blur(40px) saturate(150%);
        }

        .social-button:hover {
            background: var(--orange-glass-primary);
            border-color: #FF6B35;
            transform: translateY(-2px) scale(1.02);
            box-shadow: var(--orange-shadow-soft);
        }

        /* Features Sophistiqué */
        .features-list {
            margin-top: 40px;
            text-align: left;
            background: var(--orange-glass-tertiary);
            padding: 28px;
            border-radius: 24px;
            border: 1px solid var(--orange-glass-border);
            backdrop-filter: blur(50px) saturate(200%);
            box-shadow: var(--orange-shadow-soft);
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 18px;
            font-size: 15px;
            color: var(--coach-text-secondary);
            font-weight: 500;
        }

        .feature-icon {
            width: 34px;
            height: 34px;
            background: var(--orange-secondary-gradient);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #FFFFFF;
            box-shadow: var(--orange-glow-subtle);
            animation: feature-sophisticated 4s ease-in-out infinite;
            backdrop-filter: blur(10px);
        }

        @keyframes feature-sophisticated {
            0%, 100% { 
                transform: scale(1);
                box-shadow: var(--orange-glow-subtle);
            }
            50% { 
                transform: scale(1.05);
                box-shadow: var(--orange-glow-elegant);
            }
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 40px;
        }

        .register-link {
            color: var(--coach-text-secondary);
            font-size: 15px;
            font-weight: 500;
        }

        .register-link a {
            background: var(--orange-secondary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }

        .register-link a:hover {
            text-decoration: underline;
            filter: drop-shadow(0 0 15px rgba(255, 107, 53, 0.5));
        }
    </style>
</head>
<body>
    <div class="mobile-container">
        <!-- Header -->
        <div class="header">
            <div class="logo-container">
                <div class="logo">MC</div>
            </div>
            
            <div class="welcome-text">
                <h1 class="title">Espace Coach</h1>
                <p class="subtitle">Interface professionnelle de gestion</p>
                <div class="professional-badge">
                    <span>✨</span>
                    <span>Premium Professional</span>
                </div>
            </div>
        </div>

        <!-- Login Form -->
        <form class="login-form">
            <div class="form-group">
                <label class="input-label">Email Professionnel</label>
                <div class="input-container">
                    <input 
                        type="email" 
                        class="form-input" 
                        placeholder="thomas@coach-example.com"
                        value="thomas@coach-example.com"
                    />
                </div>
            </div>

            <div class="form-group">
                <label class="input-label">Mot de Passe</label>
                <div class="input-container">
                    <input 
                        type="password" 
                        class="form-input" 
                        placeholder="••••••••"
                    />
                    <button type="button" class="password-toggle">👁</button>
                </div>
            </div>

            <div class="form-options">
                <div class="remember-container">
                    <input type="checkbox" class="checkbox" id="remember" checked />
                    <label class="checkbox-label" for="remember">Se souvenir</label>
                </div>
                <a href="#" class="forgot-link">Mot de passe oublié ?</a>
            </div>

            <button type="submit" class="login-button">
                <span>Accéder au Tableau de Bord</span>
            </button>

            <div class="divider">
                <span>ou continuer avec</span>
            </div>

            <div class="social-buttons">
                <button class="social-button">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                </button>
                
                <button class="social-button">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="#1877F2">
                        <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                    </svg>
                </button>

                <button class="social-button">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="#000">
                        <path d="M12 0C5.374 0 0 5.373 0 12s5.374 12 12 12 12-5.373 12-12S18.626 0 12 0zm5.568 8.16c-.169 1.858-.896 3.646-2.082 5.062-1.188 1.416-2.778 2.536-4.518 3.18-1.742.643-3.627.816-5.463.49.85.634 1.808 1.065 2.822 1.065 1.063 0 2.066-.426 2.773-1.179.707-.753 1.098-1.774 1.083-2.838-.016-1.063-.439-2.073-1.172-2.804-.733-.731-1.745-1.14-2.808-1.14-.618 0-1.224.142-1.777.414.083-.924.429-1.817.999-2.557.569-.74 1.344-1.288 2.213-1.566.868-.279 1.796-.272 2.661.02.866.292 1.635.832 2.203 1.546z"/>
                    </svg>
                </button>
            </div>
        </form>

        <!-- Professional Features -->
        <div class="features-list">
            <div class="feature-item">
                <div class="feature-icon">👥</div>
                <span>Gestion avancée des clients</span>
            </div>
            <div class="feature-item">
                <div class="feature-icon">📊</div>
                <span>Analytics et reporting détaillés</span>
            </div>
            <div class="feature-item">
                <div class="feature-icon">💰</div>
                <span>Facturation et paiements</span>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <p class="register-link">
                Pas encore de compte professionnel ?
                <a href="#">Demander un accès</a>
            </p>
        </div>
    </div>
</body>
</html>
