<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyCoach - Login Coach Orange V3 Maximal</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ORANGE FLASHY PALETTE V3 - MAXIMAL INTENSITY */
        :root {
            --orange-flashy-primary: #FF4500;
            --orange-flashy-hover: #FF6B35;
            --orange-flashy-pressed: #CC3700;
            --orange-electric: #FF5722;
            --orange-neon: #FF7043;
            --orange-bright: #FF8C42;
            --orange-golden: #FFB74D;
            --orange-blast: #FF9800;
            --orange-flame: #F57F17;
            
            --orange-glow-max: rgba(255, 69, 0, 1.0);
            --orange-glow-intense: rgba(255, 69, 0, 0.8);
            --orange-glow-medium: rgba(255, 69, 0, 0.4);
            --orange-glow-subtle: rgba(255, 69, 0, 0.2);
            
            --coach-background-primary: #0A0E1A;
            --coach-background-secondary: #1A1F2E;
            --coach-background-tertiary: #2A2F3E;
            --coach-text-primary: #FFFFFF;
            --coach-text-secondary: #B8C4D6;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: linear-gradient(135deg, 
                var(--coach-background-primary) 0%, 
                var(--coach-background-secondary) 30%, 
                var(--coach-background-tertiary) 60%,
                rgba(255, 69, 0, 0.05) 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--coach-text-primary);
            position: relative;
            overflow-x: hidden;
        }

        /* Background Pattern Maximal Orange */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 15% 85%, var(--orange-glow-medium) 0%, transparent 50%),
                radial-gradient(circle at 85% 15%, var(--orange-glow-medium) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, var(--orange-glow-subtle) 0%, transparent 70%),
                linear-gradient(45deg, rgba(255, 69, 0, 0.02) 0%, transparent 100%);
            pointer-events: none;
            z-index: 0;
            animation: background-pulse 8s ease-in-out infinite;
        }

        @keyframes background-pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; }
        }

        .mobile-container {
            position: relative;
            z-index: 1;
            width: 375px;
            min-height: 812px;
            padding: 60px 32px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255, 69, 0, 0.03);
            border-radius: 24px;
            backdrop-filter: blur(10px);
            border: 1px solid var(--orange-glow-subtle);
        }

        /* Header Section */
        .header {
            text-align: center;
            margin-bottom: 60px;
            position: relative;
        }

        .logo-container {
            margin-bottom: 32px;
            position: relative;
        }

        /* Logo Ultra Flashy */
        .logo {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, 
                var(--orange-flashy-primary) 0%,
                var(--orange-electric) 25%,
                var(--orange-bright) 50%,
                var(--orange-blast) 75%,
                var(--orange-golden) 100%);
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            font-size: 48px;
            font-weight: 800;
            box-shadow: 
                0 0 60px var(--orange-glow-intense),
                0 0 120px var(--orange-glow-medium),
                0 0 180px var(--orange-glow-subtle),
                inset 0 0 30px rgba(255, 255, 255, 0.2);
            animation: logo-explosion 3s ease-in-out infinite;
            position: relative;
            overflow: hidden;
        }

        .logo::before {
            content: '';
            position: absolute;
            inset: -6px;
            border-radius: 46px;
            background: conic-gradient(from 0deg, var(--orange-flashy-primary), var(--orange-electric), var(--orange-bright), var(--orange-blast), var(--orange-flashy-primary));
            z-index: -1;
            opacity: 0.8;
            animation: logo-rotate 6s linear infinite;
        }

        .logo::after {
            content: '';
            position: absolute;
            inset: 20px;
            border-radius: 20px;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            animation: logo-shimmer 2s ease-in-out infinite;
        }

        @keyframes logo-explosion {
            0%, 100% { 
                transform: scale(1);
                box-shadow: 
                    0 0 60px var(--orange-glow-intense),
                    0 0 120px var(--orange-glow-medium),
                    0 0 180px var(--orange-glow-subtle);
            }
            50% { 
                transform: scale(1.05);
                box-shadow: 
                    0 0 80px var(--orange-glow-max),
                    0 0 160px var(--orange-glow-intense),
                    0 0 240px var(--orange-glow-medium);
            }
        }

        @keyframes logo-rotate {
            to { transform: rotate(360deg); }
        }

        @keyframes logo-shimmer {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        .welcome-text {
            margin-top: 24px;
        }

        .title {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 8px;
            background: linear-gradient(135deg, 
                #FFFFFF 0%, 
                var(--orange-flashy-primary) 30%, 
                var(--orange-electric) 70%, 
                var(--orange-golden) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px var(--orange-glow-medium);
            animation: title-glow 4s ease-in-out infinite;
        }

        @keyframes title-glow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.3); }
        }

        .subtitle {
            font-size: 16px;
            color: var(--coach-text-secondary);
            font-weight: 500;
        }

        .professional-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--orange-glow-medium), var(--orange-glow-subtle));
            border: 2px solid var(--orange-flashy-primary);
            padding: 12px 20px;
            border-radius: 25px;
            margin-top: 16px;
            font-size: 14px;
            color: var(--orange-flashy-primary);
            font-weight: 700;
            box-shadow: 
                0 0 30px var(--orange-glow-medium),
                inset 0 0 20px rgba(255, 255, 255, 0.1);
            animation: badge-pulse 2s ease-in-out infinite;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        @keyframes badge-pulse {
            0%, 100% { 
                transform: scale(1);
                box-shadow: 0 0 20px var(--orange-glow-medium);
            }
            50% { 
                transform: scale(1.02);
                box-shadow: 0 0 40px var(--orange-glow-intense);
            }
        }

        /* Login Form Maximal */
        .login-form {
            width: 100%;
            max-width: 320px;
            background: rgba(255, 69, 0, 0.05);
            padding: 32px;
            border-radius: 20px;
            border: 1px solid var(--orange-glow-subtle);
            backdrop-filter: blur(20px);
        }

        .form-group {
            margin-bottom: 28px;
        }

        .input-label {
            display: block;
            font-size: 15px;
            font-weight: 700;
            color: var(--orange-flashy-primary);
            margin-bottom: 10px;
            text-shadow: 0 0 15px var(--orange-glow-subtle);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-container {
            position: relative;
        }

        .form-input {
            width: 100%;
            background: linear-gradient(135deg, rgba(255, 69, 0, 0.15), rgba(255, 140, 66, 0.1));
            border: 2px solid var(--orange-flashy-primary);
            border-radius: 18px;
            padding: 18px 24px;
            font-size: 16px;
            color: var(--coach-text-primary);
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 500;
            backdrop-filter: blur(30px);
            transition: all 0.3s ease;
            box-shadow: 
                0 0 25px var(--orange-glow-subtle),
                inset 0 0 20px rgba(255, 255, 255, 0.05);
        }

        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
            font-weight: 400;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--orange-electric);
            box-shadow: 
                0 0 0 4px var(--orange-glow-medium),
                0 0 40px var(--orange-glow-intense);
            background: linear-gradient(135deg, rgba(255, 69, 0, 0.2), rgba(255, 140, 66, 0.15));
            transform: translateY(-2px);
        }

        .password-toggle {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            background: linear-gradient(135deg, var(--orange-flashy-primary), var(--orange-electric));
            border: none;
            color: #FFFFFF;
            font-size: 18px;
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px var(--orange-glow-subtle);
        }

        .password-toggle:hover {
            transform: translateY(-50%) scale(1.1);
            box-shadow: 0 0 25px var(--orange-glow-intense);
        }

        /* Form Options */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 36px;
        }

        .remember-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox {
            width: 22px;
            height: 22px;
            border: 3px solid var(--orange-flashy-primary);
            border-radius: 6px;
            background: transparent;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .checkbox:checked {
            background: linear-gradient(135deg, var(--orange-flashy-primary), var(--orange-electric));
            border-color: var(--orange-electric);
            box-shadow: 0 0 20px var(--orange-glow-intense);
        }

        .checkbox-label {
            font-size: 14px;
            color: var(--coach-text-secondary);
            cursor: pointer;
            font-weight: 500;
        }

        .forgot-link {
            font-size: 14px;
            color: var(--orange-flashy-primary);
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s ease;
            text-shadow: 0 0 15px var(--orange-glow-subtle);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .forgot-link:hover {
            color: var(--orange-electric);
            text-decoration: underline;
            text-shadow: 0 0 20px var(--orange-glow-intense);
            transform: scale(1.05);
        }

        /* Button Ultra Flashy */
        .login-button {
            width: 100%;
            background: linear-gradient(135deg, 
                var(--orange-flashy-primary) 0%,
                var(--orange-electric) 25%,
                var(--orange-bright) 50%,
                var(--orange-blast) 75%,
                var(--orange-golden) 100%);
            border: none;
            border-radius: 20px;
            padding: 22px;
            font-size: 18px;
            font-weight: 800;
            color: var(--coach-text-primary);
            cursor: pointer;
            transition: all 0.4s ease;
            margin-bottom: 24px;
            font-family: 'Space Grotesk', sans-serif;
            box-shadow: 
                0 0 50px var(--orange-glow-intense),
                0 0 100px var(--orange-glow-medium),
                0 15px 30px rgba(255, 69, 0, 0.3);
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .login-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: left 0.8s ease;
        }

        .login-button::after {
            content: '';
            position: absolute;
            inset: 2px;
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), transparent, rgba(255, 255, 255, 0.1));
            pointer-events: none;
        }

        .login-button:hover::before {
            left: 100%;
        }

        .login-button:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 
                0 0 80px var(--orange-glow-max),
                0 0 150px var(--orange-glow-intense),
                0 20px 40px rgba(255, 69, 0, 0.5);
        }

        .login-button:active {
            transform: scale(0.98) translateY(-2px);
        }

        /* Social avec Orange */
        .divider {
            display: flex;
            align-items: center;
            margin: 36px 0;
            color: var(--coach-text-secondary);
            font-size: 14px;
            font-weight: 600;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--orange-flashy-primary), transparent);
            box-shadow: 0 0 10px var(--orange-glow-subtle);
        }

        .divider span {
            padding: 0 20px;
            background: rgba(255, 69, 0, 0.1);
            border-radius: 15px;
            border: 1px solid var(--orange-glow-subtle);
        }

        .social-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 36px;
        }

        .social-button {
            flex: 1;
            background: linear-gradient(135deg, rgba(255, 69, 0, 0.15), rgba(255, 140, 66, 0.1));
            border: 2px solid var(--orange-flashy-primary);
            border-radius: 15px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(30px);
        }

        .social-button:hover {
            background: linear-gradient(135deg, var(--orange-glow-medium), rgba(255, 140, 66, 0.2));
            border-color: var(--orange-electric);
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 10px 30px var(--orange-glow-medium);
        }

        /* Features Ultra Orange */
        .features-list {
            margin-top: 40px;
            text-align: left;
            background: rgba(255, 69, 0, 0.05);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid var(--orange-glow-subtle);
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            font-size: 15px;
            color: var(--coach-text-secondary);
            font-weight: 500;
        }

        .feature-icon {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--orange-flashy-primary), var(--orange-electric));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: #FFFFFF;
            box-shadow: 0 0 20px var(--orange-glow-medium);
            animation: feature-float 3s ease-in-out infinite;
        }

        @keyframes feature-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-3px); }
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 40px;
        }

        .register-link {
            color: var(--coach-text-secondary);
            font-size: 15px;
            font-weight: 500;
        }

        .register-link a {
            color: var(--orange-flashy-primary);
            text-decoration: none;
            font-weight: 700;
            text-shadow: 0 0 15px var(--orange-glow-subtle);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .register-link a:hover {
            text-decoration: underline;
            color: var(--orange-electric);
            text-shadow: 0 0 20px var(--orange-glow-intense);
        }
    </style>
</head>
<body>
    <div class="mobile-container">
        <!-- Header -->
        <div class="header">
            <div class="logo-container">
                <div class="logo">MC</div>
            </div>
            
            <div class="welcome-text">
                <h1 class="title">Espace Coach</h1>
                <p class="subtitle">Interface professionnelle de gestion</p>
                <div class="professional-badge">
                    <span>🔥</span>
                    <span>Professionnel Premium</span>
                </div>
            </div>
        </div>

        <!-- Login Form -->
        <form class="login-form">
            <div class="form-group">
                <label class="input-label">Email Professionnel</label>
                <div class="input-container">
                    <input 
                        type="email" 
                        class="form-input" 
                        placeholder="thomas@coach-example.com"
                        value="thomas@coach-example.com"
                    />
                </div>
            </div>

            <div class="form-group">
                <label class="input-label">Mot de Passe</label>
                <div class="input-container">
                    <input 
                        type="password" 
                        class="form-input" 
                        placeholder="••••••••"
                    />
                    <button type="button" class="password-toggle">👁</button>
                </div>
            </div>

            <div class="form-options">
                <div class="remember-container">
                    <input type="checkbox" class="checkbox" id="remember" checked />
                    <label class="checkbox-label" for="remember">Se souvenir</label>
                </div>
                <a href="#" class="forgot-link">Mot de passe oublié ?</a>
            </div>

            <button type="submit" class="login-button">
                <span>Accéder au Tableau de Bord</span>
            </button>

            <div class="divider">
                <span>ou continuer avec</span>
            </div>

            <div class="social-buttons">
                <button class="social-button">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                </button>
                
                <button class="social-button">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="#1877F2">
                        <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                    </svg>
                </button>

                <button class="social-button">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="#000">
                        <path d="M12 0C5.374 0 0 5.373 0 12s5.374 12 12 12 12-5.373 12-12S18.626 0 12 0zm5.568 8.16c-.169 1.858-.896 3.646-2.082 5.062-1.188 1.416-2.778 2.536-4.518 3.18-1.742.643-3.627.816-5.463.49.85.634 1.808 1.065 2.822 1.065 1.063 0 2.066-.426 2.773-1.179.707-.753 1.098-1.774 1.083-2.838-.016-1.063-.439-2.073-1.172-2.804-.733-.731-1.745-1.14-2.808-1.14-.618 0-1.224.142-1.777.414.083-.924.429-1.817.999-2.557.569-.74 1.344-1.288 2.213-1.566.868-.279 1.796-.272 2.661.02.866.292 1.635.832 2.203 1.546z"/>
                    </svg>
                </button>
            </div>
        </form>

        <!-- Professional Features -->
        <div class="features-list">
            <div class="feature-item">
                <div class="feature-icon">👥</div>
                <span>Gestion avancée des clients</span>
            </div>
            <div class="feature-item">
                <div class="feature-icon">📊</div>
                <span>Analytics et reporting détaillés</span>
            </div>
            <div class="feature-item">
                <div class="feature-icon">💰</div>
                <span>Facturation et paiements</span>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <p class="register-link">
                Pas encore de compte professionnel ?
                <a href="#">Demander un accès</a>
            </p>
        </div>
    </div>
</body>
</html>
