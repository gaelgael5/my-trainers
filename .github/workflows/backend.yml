name: Backend Docker Build

on:
  push:
    branches: [ dev ]
    paths: 
      - 'backend/**'
      - '.github/workflows/backend.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Extract build ID
      run: echo "BUILD_ID=${GITHUB_SHA::7}" >> $GITHUB_ENV
      
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev${{ env.BUILD_ID }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
          
    - name: Notify Discord
      if: always()
      run: |
        STATUS="${{ job.status }}"
        COLOR="3066993"
        if [ "$STATUS" != "success" ]; then COLOR="15158332"; fi
        
        curl -H "Content-Type: application/json" \
        -d "{\"embeds\":[{\"title\":\"Backend Build $STATUS\",\"description\":\"Image: dev$BUILD_ID\",\"color\":$COLOR}]}" \
        ${{ secrets.DISCORD_WEBHOOK_URL || 'https://httpbin.org/post' }}