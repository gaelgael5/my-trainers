name: Flutter Android Build

on:
  push:
    branches: [dev, uat]
    paths:
      - 'flutter/**'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    paths:
      - 'flutter/**'

env:
  FLUTTER_VERSION: '3.24.5'
  JAVA_VERSION: '17'

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set environment
        id: env
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          if [[ "$BRANCH" == "uat" ]]; then
            echo "ENV=staging" >> $GITHUB_OUTPUT
          else
            echo "ENV=dev" >> $GITHUB_OUTPUT
          fi
          if [[ "$BRANCH" == "uat" ]]; then
            echo "API_URL=https://api-uat.my-trainers.app" >> $GITHUB_OUTPUT
          else
            echo "API_URL=https://api-dev.my-trainers.app" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true
          cache-key: flutter-${{ env.FLUTTER_VERSION }}-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          cache-path: ${{ runner.tool_cache }}/flutter

      - name: Debug Environment
        run: |
          echo "🔍 Environment verification..."
          flutter --version
          dart --version
          echo "Available space: $(df -h /)"
          echo "Java version: $(java -version 2>&1 | head -1)"
          flutter doctor -v

      - name: Install dependencies
        working-directory: flutter
        timeout-minutes: 15
        run: |
          echo "🧹 Cleaning workspace..."
          flutter clean
          echo "🔧 Repairing pub cache..."
          flutter pub cache repair
          echo "📦 Installing dependencies..."
          flutter pub get --verbose
          echo "✅ Dependencies installed successfully"

      - name: Analyze
        working-directory: flutter
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        working-directory: flutter
        run: flutter test --coverage --dart-define=ENV=test --dart-define=API_BASE_URL=http://localhost:8000

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: flutter/coverage/lcov.info
          if-no-files-found: ignore

      # ─── Build APK ────────────────────────────────────────────────────
      - name: Build APK
        timeout-minutes: 20
        working-directory: flutter
        run: |
          echo "🔧 Configuration du build..."
          echo "Branch: ${{ github.ref_name }}"
          echo "Environment: ${{ steps.env.outputs.ENV }}"
          echo "API URL: ${{ steps.env.outputs.API_URL }}"
          
          sed -i "s/version: 1.0.0+.*/version: 1.0.0+${{ github.run_number }}/" pubspec.yaml
          echo "Version mise à jour: $(grep version pubspec.yaml)"
          
          if [[ "${{ github.ref_name }}" == "uat" ]]; then
            echo "🚀 Building RELEASE APK..."
            flutter build apk --release \
              --dart-define=ENV=${{ steps.env.outputs.ENV }} \
              --dart-define=API_BASE_URL=${{ steps.env.outputs.API_URL }} \
              --verbose
          else
            echo "🔧 Building DEBUG APK..."
            flutter build apk --debug \
              --dart-define=ENV=${{ steps.env.outputs.ENV }} \
              --dart-define=API_BASE_URL=${{ steps.env.outputs.API_URL }} \
              --verbose
          fi
          
          echo "📦 Vérification du build..."
          ls -la build/app/outputs/flutter-apk/
          
          # Vérifier que l'APK existe
          if [[ "${{ github.ref_name }}" == "uat" ]]; then
            APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          else
            APK_PATH="build/app/outputs/flutter-apk/app-debug.apk"
          fi
          
          if [[ -f "$APK_PATH" ]]; then
            APK_SIZE=$(stat -c%s "$APK_PATH" | numfmt --to=iec)
            echo "✅ APK créé avec succès: $APK_PATH ($APK_SIZE)"
          else
            echo "❌ APK non trouvé: $APK_PATH"
            echo "Contenu du dossier build:"
            find build -name "*.apk" -type f
            exit 1
          fi

      # ─── Firebase App Distribution (dev builds → testers) ─────────────
      - name: Upload to Firebase App Distribution
        if: github.ref_name == 'dev'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: "1:320022309385:android:bc7af5200bebdd4b13e6d8"
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: flutter/build/app/outputs/flutter-apk/app-debug.apk
          releaseNotes: "DEV Build #${{ github.run_number }} — ${{ github.event.head_commit.message }}"

      # ─── Firebase App Distribution (uat builds → testers) ──────────────
      - name: Upload UAT to Firebase
        if: github.ref_name == 'uat'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: "1:320022309385:android:bc7af5200bebdd4b13e6d8"
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: flutter/build/app/outputs/flutter-apk/app-release.apk
          releaseNotes: "UAT Build #${{ github.run_number }} — ${{ github.event.head_commit.message }}"

      # ─── Artifacts ─────────────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-trainers-${{ github.ref_name }}-${{ github.run_number }}
          path: flutter/build/app/outputs/flutter-apk/app-*.apk
          retention-days: 30