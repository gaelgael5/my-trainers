name: 🗄️ Database Backup & Management

on:
  schedule:
    # Backup quotidien à 2h du matin UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      backup_type:
        description: 'Type de backup'
        required: true
        default: 'full'
        type: choice
        options:
        - full
        - schema-only
        - data-only
      environment:
        description: 'Environnement'
        required: true
        default: 'production'
        type: choice
        options:
        - production
        - staging

env:
  AWS_REGION: eu-west-1
  BACKUP_RETENTION_DAYS: 30

jobs:
  backup-database:
    name: 🗄️ PostgreSQL Backup
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-15
          
      - name: Configure AWS CLI
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 📦 Create Database Backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_TYPE: ${{ github.event.inputs.backup_type || 'full' }}
          ENV: ${{ github.event.inputs.environment || 'production' }}
        run: |
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          BACKUP_FILE="mycoach_${ENV}_${BACKUP_TYPE}_${TIMESTAMP}.sql"
          S3_BUCKET="mycoach-backups-$(echo $ENV | tr '[:upper:]' '[:lower:]')"
          
          echo "🔧 Creating ${BACKUP_TYPE} backup..."
          
          case $BACKUP_TYPE in
            "schema-only")
              pg_dump --schema-only --no-owner --no-privileges "$DATABASE_URL" > "$BACKUP_FILE"
              ;;
            "data-only")
              pg_dump --data-only --no-owner --no-privileges "$DATABASE_URL" > "$BACKUP_FILE"
              ;;
            *)
              pg_dump --no-owner --no-privileges "$DATABASE_URL" > "$BACKUP_FILE"
              ;;
          esac
          
          echo "📊 Backup file size: $(du -h $BACKUP_FILE | cut -f1)"
          
          # Compression
          echo "🗜️ Compressing backup..."
          gzip "$BACKUP_FILE"
          BACKUP_FILE="${BACKUP_FILE}.gz"
          echo "📊 Compressed size: $(du -h $BACKUP_FILE | cut -f1)"
          
          # Upload vers S3
          echo "☁️ Uploading to S3..."
          aws s3 cp "$BACKUP_FILE" "s3://${S3_BUCKET}/backups/$(date +%Y)/$(date +%m)/"
          
          # Validation de l'upload
          if aws s3 ls "s3://${S3_BUCKET}/backups/$(date +%Y)/$(date +%m)/$BACKUP_FILE" > /dev/null; then
            echo "✅ Backup uploaded successfully to S3"
          else
            echo "❌ Backup upload failed"
            exit 1
          fi
          
          # Sauvegarde locale pour les workflows
          echo "BACKUP_FILE=$BACKUP_FILE" >> $GITHUB_ENV

      - name: 🧹 Cleanup Old Backups
        run: |
          ENV=${{ github.event.inputs.environment || 'production' }}
          S3_BUCKET="mycoach-backups-$(echo $ENV | tr '[:upper:]' '[:lower:]')"
          CUTOFF_DATE=$(date -d "$BACKUP_RETENTION_DAYS days ago" +%Y-%m-%d)
          
          echo "🗑️ Removing backups older than $CUTOFF_DATE..."
          
          # Liste et supprime les anciens backups
          aws s3api list-objects-v2 \
            --bucket "$S3_BUCKET" \
            --prefix "backups/" \
            --query "Contents[?LastModified<='$CUTOFF_DATE'].Key" \
            --output text | \
          while read -r key; do
            if [ -n "$key" ]; then
              echo "Deleting: s3://$S3_BUCKET/$key"
              aws s3 rm "s3://$S3_BUCKET/$key"
            fi
          done

      - name: 🔍 Backup Verification
        run: |
          if [ -f "$BACKUP_FILE" ]; then
            # Test de l'intégrité du fichier compressé
            if gzip -t "$BACKUP_FILE"; then
              echo "✅ Backup file integrity verified"
            else
              echo "❌ Backup file corrupted"
              exit 1
            fi
            
            # Affichage des infos
            BACKUP_SIZE=$(du -h "$BACKUP_FILE" | cut -f1)
            LINES_COUNT=$(zcat "$BACKUP_FILE" | wc -l)
            
            echo "## 📊 Backup Summary" >> $GITHUB_STEP_SUMMARY
            echo "- **File**: $BACKUP_FILE" >> $GITHUB_STEP_SUMMARY
            echo "- **Size**: $BACKUP_SIZE" >> $GITHUB_STEP_SUMMARY
            echo "- **Lines**: $LINES_COUNT" >> $GITHUB_STEP_SUMMARY
            echo "- **Type**: ${{ github.event.inputs.backup_type || 'full' }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Environment**: ${{ github.event.inputs.environment || 'production' }}" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 📢 Notification
        if: failure()
        run: |
          curl -X POST ${{ secrets.DISCORD_WEBHOOK }} \
            -H "Content-Type: application/json" \
            -d '{
              "embeds": [{
                "title": "❌ Database Backup Failed",
                "description": "Environment: ${{ github.event.inputs.environment || \"production\" }}\nType: ${{ github.event.inputs.backup_type || \"full\" }}",
                "color": 15158332,
                "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
              }]
            }' || echo "Discord notification failed"

  # ═══════════════════════════════════════════════════════════════
  # 🔬 BACKUP TESTING (Mensuel)
  # ═══════════════════════════════════════════════════════════════
  test-backup-restore:
    name: 🔬 Test Backup Restore
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule == '0 2 1 * *' # Premier du mois
    needs: backup-database
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_USER: testuser  
          POSTGRES_DB: restore_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Setup PostgreSQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-15

      - name: Configure AWS CLI
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🧪 Test Latest Backup Restore
        run: |
          S3_BUCKET="mycoach-backups-production"
          
          # Récupère le dernier backup
          LATEST_BACKUP=$(aws s3 ls "s3://$S3_BUCKET/backups/" --recursive | \
            grep "\.sql\.gz$" | sort | tail -1 | awk '{print $4}')
          
          echo "📁 Testing restore of: $LATEST_BACKUP"
          
          # Télécharge et restaure
          aws s3 cp "s3://$S3_BUCKET/$LATEST_BACKUP" ./test_backup.sql.gz
          gunzip test_backup.sql.gz
          
          # Test de restauration
          PGPASSWORD=testpass psql -h localhost -U testuser -d restore_test -f test_backup.sql
          
          # Vérification basique
          TABLE_COUNT=$(PGPASSWORD=testpass psql -h localhost -U testuser -d restore_test -t -c "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public';" | xargs)
          
          if [ "$TABLE_COUNT" -gt 0 ]; then
            echo "✅ Backup restore test successful ($TABLE_COUNT tables restored)"
          else
            echo "❌ Backup restore test failed (no tables found)"
            exit 1
          fi

      - name: 📊 Restore Test Summary
        run: |
          echo "## 🧪 Backup Restore Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ✅ Passed" >> $GITHUB_STEP_SUMMARY  
          echo "- **Tables Restored**: $TABLE_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Date**: $(date)" >> $GITHUB_STEP_SUMMARY