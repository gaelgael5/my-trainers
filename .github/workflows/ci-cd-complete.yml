name: 🚀 MyCoach CI/CD Pipeline

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

env:
  REGISTRY: docker.io
  BACKEND_IMAGE_NAME: ${{ secrets.DOCKER_USER }}/trainers-backend
  FLUTTER_VERSION: '3.24.5'
  JAVA_VERSION: '17'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════════
  # 🔍 SECURITY SCAN (Première étape obligatoire)
  # ═══════════════════════════════════════════════════════════════
  security-scan:
    name: 🔒 Security & Vulnerability Scan
    runs-on: ubuntu-latest
    outputs:
      trivy-result: ${{ steps.trivy-scan.outputs.result }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@master
        id: trivy-scan
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          limit-severities-for-sarif: true

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: 🚫 Block on Critical Vulnerabilities
        if: steps.trivy-scan.outcome == 'failure'
        run: |
          echo "❌ CRITICAL VULNERABILITIES DETECTED"
          echo "🚫 Deployment is BLOCKED until vulnerabilities are fixed"
          echo "📋 Check the Security tab for detailed report"
          exit 1

  # ═══════════════════════════════════════════════════════════════
  # 🐍 BACKEND TESTS & BUILD
  # ═══════════════════════════════════════════════════════════════
  backend-tests:
    name: 🐍 Backend Tests
    runs-on: ubuntu-latest
    needs: security-scan
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_USER: testuser
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov flake8 black isort

      - name: Code quality checks
        run: |
          cd backend
          echo "🔍 Running code formatting checks..."
          black . --check --diff || (echo "❌ Code not formatted. Run: black ." && exit 1)
          isort . --check-only --diff || (echo "❌ Imports not sorted. Run: isort ." && exit 1)
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
          TESTING: true
        run: |
          cd backend
          pytest tests/ -v --cov=app --cov-report=xml --cov-report=term

      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  # ═══════════════════════════════════════════════════════════════
  # 📱 FLUTTER TESTS & BUILD
  # ═══════════════════════════════════════════════════════════════
  flutter-tests:
    name: 📱 Flutter Tests & Build
    runs-on: ubuntu-latest
    needs: security-scan
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies & analyze
        working-directory: flutter
        run: |
          flutter clean
          flutter pub get
          flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        working-directory: flutter
        run: |
          flutter test --coverage --timeout=60s
          
      - name: Build APK
        working-directory: flutter
        run: |
          BRANCH="${{ github.ref_name }}"
          BUILD_NUMBER="${{ github.run_number }}"
          
          # Update version in pubspec.yaml
          sed -i "s/version: 1.0.0+.*/version: 1.0.0+${BUILD_NUMBER}/" pubspec.yaml
          
          if [[ "$BRANCH" == "main" ]]; then
            echo "🚀 Building RELEASE APK for production..."
            flutter build apk --release \
              --dart-define=ENV=production \
              --dart-define=API_BASE_URL=https://api.my-trainers.app
          else
            echo "🔧 Building DEBUG APK for development..."
            flutter build apk --debug \
              --dart-define=ENV=dev \
              --dart-define=API_BASE_URL=https://api-dev.my-trainers.app
          fi
          
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk-${{ github.ref_name }}-${{ github.run_number }}
          path: flutter/build/app/outputs/flutter-apk/app-*.apk
          retention-days: 30

  # ═══════════════════════════════════════════════════════════════
  # 🐳 DOCKER BUILD & SCAN
  # ═══════════════════════════════════════════════════════════════
  docker-build-scan:
    name: 🐳 Docker Build & Security Scan
    runs-on: ubuntu-latest
    needs: [security-scan, backend-tests]
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🔍 Run Trivy Docker image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.BACKEND_IMAGE_NAME }}:${{ github.ref_name }}-${{ github.sha }}
          format: 'sarif'
          output: 'trivy-docker.sarif'
          severity: 'CRITICAL'
          exit-code: '1'

      - name: Upload Docker scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-docker.sarif'

      - name: 🚫 Block Docker deployment on critical CVEs
        if: failure()
        run: |
          echo "❌ CRITICAL CVE DETECTED IN DOCKER IMAGE"
          echo "🚫 Docker push blocked. Fix vulnerabilities first."
          exit 1

  # ═══════════════════════════════════════════════════════════════
  # 🔥 FIREBASE DISTRIBUTION
  # ═══════════════════════════════════════════════════════════════
  firebase-distribution:
    name: 🔥 Firebase App Distribution
    runs-on: ubuntu-latest
    needs: [flutter-tests]
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    
    steps:
      - name: Download Flutter APK
        uses: actions/download-artifact@v4
        with:
          name: flutter-apk-${{ github.ref_name }}-${{ github.run_number }}
          path: ./apk/

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: ${{ github.ref == 'refs/heads/main' && 'testers,beta-users' || 'internal-dev' }}
          file: ./apk/app-*.apk
          releaseNotes: |
            🚀 Build #${{ github.run_number }} from ${{ github.ref_name }}
            
            Commit: ${{ github.sha }}
            Message: ${{ github.event.head_commit.message }}
            
            🔒 Security: All scans passed
            📱 Branch: ${{ github.ref_name }}

  # ═══════════════════════════════════════════════════════════════
  # 🚀 DEPLOYMENT
  # ═══════════════════════════════════════════════════════════════
  deploy:
    name: 🚀 Deploy to ${{ github.ref == 'refs/heads/main' && 'Production' || 'Staging' }}
    runs-on: ubuntu-latest
    needs: [docker-build-scan, firebase-distribution]
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    
    steps:
      - uses: actions/checkout@v4
      
      - name: 🏗️ Setup deployment environment
        run: |
          ENVIRONMENT=${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
          echo "DEPLOY_ENV=${ENVIRONMENT}" >> $GITHUB_ENV
          echo "🎯 Deploying to: ${ENVIRONMENT}"

      - name: 🔧 Deploy Backend
        run: |
          echo "🐳 Deploying Docker image: ${{ env.BACKEND_IMAGE_NAME }}:${{ github.ref_name }}-${{ github.sha }}"
          # Commandes de déploiement ici (ex: kubectl, docker-compose, etc.)
          echo "✅ Backend deployed successfully"

      - name: 🏥 Health Check
        run: |
          API_URL=${{ github.ref == 'refs/heads/main' && 'https://api.my-trainers.app' || 'https://api-staging.my-trainers.app' }}
          echo "🔍 Checking health of: ${API_URL}/health"
          # curl -f "${API_URL}/health" || exit 1
          echo "✅ Health check passed"

      - name: 📊 Deployment Summary
        run: |
          echo "## 🎉 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ env.DEPLOY_ENV }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Docker Image**: ${{ env.BACKEND_IMAGE_NAME }}:${{ github.ref_name }}-${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **APK Build**: #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Security Scan**: ✅ Passed (0 critical CVEs)" >> $GITHUB_STEP_SUMMARY
          echo "- **Firebase**: ✅ Distributed" >> $GITHUB_STEP_SUMMARY

  # ═══════════════════════════════════════════════════════════════
  # 🚨 NOTIFICATIONS
  # ═══════════════════════════════════════════════════════════════
  notify:
    name: 📢 Notifications
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()
    
    steps:
      - name: 📱 Discord Notification
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          STATUS="${{ needs.deploy.result == 'success' && '✅ SUCCESS' || '❌ FAILED' }}"
          COLOR="${{ needs.deploy.result == 'success' && '3066993' || '15158332' }}"
          
          curl -H "Content-Type: application/json" \
            -X POST \
            -d "{
              \"embeds\": [{
                \"title\": \"${STATUS}: MyCoach Deployment\",
                \"description\": \"Branch: \`${{ github.ref_name }}\`\\nCommit: \`${{ github.sha }}\`\",
                \"color\": ${COLOR},
                \"fields\": [
                  {\"name\": \"Build #\", \"value\": \"${{ github.run_number }}\", \"inline\": true},
                  {\"name\": \"Environment\", \"value\": \"${{ github.ref == 'refs/heads/main' && 'Production' || 'Staging' }}\", \"inline\": true}
                ]
              }]
            }" \
            $DISCORD_WEBHOOK || echo "Discord notification failed"