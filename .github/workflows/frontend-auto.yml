name: Flutter Firebase Auto Deploy

on:
  push:
    branches: [ dev ]
    # MODIFICATION: Suppression du filtre 'paths' pour auto-trigger sur TOUT push
  workflow_dispatch:
    # Permet déclenchement manuel depuis GitHub UI

jobs:
  auto-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Check Flutter Changes
      id: check_changes
      run: |
        # Vérifier s'il y a des changements Flutter récents
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "Manual trigger - deploying anyway"
          echo "should_deploy=true" >> $GITHUB_OUTPUT
        elif git diff HEAD~1 HEAD --name-only | grep -E "^flutter/"; then
          echo "Flutter changes detected"
          echo "should_deploy=true" >> $GITHUB_OUTPUT
        else
          echo "No Flutter changes, but deploying anyway (auto-mode)"
          echo "should_deploy=true" >> $GITHUB_OUTPUT
        fi
        
    - name: Setup Flutter
      if: steps.check_changes.outputs.should_deploy == 'true'
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
        
    - name: Flutter pub get
      if: steps.check_changes.outputs.should_deploy == 'true'
      run: |
        cd flutter
        flutter pub get
        
    - name: Build Web
      if: steps.check_changes.outputs.should_deploy == 'true'
      run: |
        cd flutter
        flutter build web --release
        
    - name: Build APK (Debug for testing)
      if: steps.check_changes.outputs.should_deploy == 'true'
      run: |
        cd flutter
        flutter build apk --debug
        
    - name: Upload APK to Artifacts
      if: steps.check_changes.outputs.should_deploy == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: mycoach-auto-debug-apk
        path: flutter/build/app/outputs/flutter-apk/app-debug.apk
        
    - name: Install Firebase CLI
      if: steps.check_changes.outputs.should_deploy == 'true'
      run: npm install -g firebase-tools
      
    - name: Deploy to Firebase Hosting  
      if: steps.check_changes.outputs.should_deploy == 'true'
      run: |
        cd flutter
        firebase deploy --only hosting \
          --project "${{ secrets.FIREBASE_PROJECT_ID || 'my-trainers-e7c26' }}" \
          --token "${{ secrets.FIREBASE_TOKEN }}" \
          --non-interactive
      continue-on-error: true
          
    - name: Deploy APK to Firebase App Distribution
      if: steps.check_changes.outputs.should_deploy == 'true'
      run: |
        cd flutter
        firebase appdistribution:distribute \
          build/app/outputs/flutter-apk/app-debug.apk \
          --app "${{ secrets.FIREBASE_APP_ID }}" \
          --token "${{ secrets.FIREBASE_TOKEN }}" \
          --groups "mycoach-testers" \
          --release-notes "Auto-deploy depuis commit ${{ github.sha }}" \
          --non-interactive
      continue-on-error: true
      
    - name: Report Results
      if: always()
      run: |
        STATUS="${{ job.status }}"
        if [ "$STATUS" = "success" ]; then
          echo "🎉 ✅ AUTO-DEPLOY SUCCESS!"
          echo "🔥 Firebase Deploy: DONE"
          echo "📱 APK Build: DONE" 
          echo "🚀 Commit: ${{ github.sha }}"
        else
          echo "❌ AUTO-DEPLOY FAILED"
          echo "🔍 Check logs above for errors"
          echo "💡 Likely cause: Missing secrets or Firebase permissions"
        fi