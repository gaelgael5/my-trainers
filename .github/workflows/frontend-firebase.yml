name: Frontend Flutter CI/CD

on:
  push:
    branches: [dev]
    paths: ['flutter/**']
  pull_request:
    branches: [dev]
    paths: ['flutter/**']

env:
  FLUTTER_VERSION: '3.16.0'

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true
        
    - name: Get dependencies
      working-directory: flutter
      run: flutter pub get
      
    - name: Analyze code
      working-directory: flutter
      run: flutter analyze
      
    - name: Run tests
      working-directory: flutter
      run: flutter test --coverage
      
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: flutter/coverage/lcov.info
        flags: frontend

  build-apk:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true
        
    - name: Get dependencies
      working-directory: flutter
      run: flutter pub get
      
    - name: Build APK
      working-directory: flutter
      run: flutter build apk --release
      
    - name: Upload APK artifact
      uses: actions/upload-artifact@v3
      with:
        name: mycoach-apk-dev${{ github.run_number }}
        path: flutter/build/app/outputs/flutter-apk/app-release.apk
        retention-days: 30

  build-web:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        cache: true
        
    - name: Get dependencies
      working-directory: flutter
      run: flutter pub get
      
    - name: Build Web
      working-directory: flutter
      run: flutter build web --release
      
    - name: Upload Web artifact
      uses: actions/upload-artifact@v3
      with:
        name: mycoach-web-dev${{ github.run_number }}
        path: flutter/build/web/
        retention-days: 30

  firebase-deploy:
    runs-on: ubuntu-latest
    needs: [build-apk, build-web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download APK artifact
      uses: actions/download-artifact@v3
      with:
        name: mycoach-apk-dev${{ github.run_number }}
        path: ./apk/
        
    - name: Download Web artifact
      uses: actions/download-artifact@v3
      with:
        name: mycoach-web-dev${{ github.run_number }}
        path: ./web/
        
    - name: Set up Firebase CLI
      run: |
        npm install -g firebase-tools
        
    - name: Authenticate to Firebase
      env:
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      run: |
        echo "$FIREBASE_TOKEN" | firebase login:ci
        
    - name: Deploy to Firebase Hosting (Web)
      working-directory: flutter
      env:
        FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      run: |
        # Copy web build to public directory for Firebase Hosting
        mkdir -p public
        cp -r ../web/* public/
        
        # Deploy to Firebase Hosting
        firebase deploy --only hosting --project $FIREBASE_PROJECT_ID
        
    - name: Upload to Firebase App Distribution (APK)
      env:
        FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      run: |
        # Upload APK to Firebase App Distribution
        firebase appdistribution:distribute \
          ./apk/app-release.apk \
          --project $FIREBASE_PROJECT_ID \
          --app $FIREBASE_APP_ID \
          --groups "testers" \
          --release-notes "Dev build #${{ github.run_number }} - Branch: ${{ github.ref_name }} - Commit: ${{ github.sha }}"
          
    - name: Get App Distribution download link
      id: app_distribution
      env:
        FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      run: |
        # Get latest release info
        DOWNLOAD_LINK=$(firebase appdistribution:releases:list \
          --project $FIREBASE_PROJECT_ID \
          --app $FIREBASE_APP_ID \
          --format=json | jq -r '.[0].downloadUrl')
        echo "download_link=$DOWNLOAD_LINK" >> $GITHUB_OUTPUT
        
    - name: Notify success
      if: success()
      run: |
        echo "✅ Flutter build and Firebase deploy successful!"
        echo "Web app: https://${{ secrets.FIREBASE_PROJECT_ID }}.web.app"
        echo "APK download: ${{ steps.app_distribution.outputs.download_link }}"
        echo "Build artifacts available for 30 days in GitHub Actions"
        
    - name: Create GitHub comment with links
      if: success() && github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `🚀 **MyCoach Flutter Build Ready** \n\n` +
                  `📱 **APK for testing:** ${{ steps.app_distribution.outputs.download_link }}\n` +
                  `🌐 **Web app:** https://${{ secrets.FIREBASE_PROJECT_ID }}.web.app\n` +
                  `📦 **GitHub Artifacts:** Available in Actions tab\n\n` +
                  `*Build #${{ github.run_number }} from commit ${{ github.sha }}*`
          })
          
    - name: Notify failure
      if: failure()
      run: |
        echo "❌ Flutter build or Firebase deploy failed!"
        exit 1