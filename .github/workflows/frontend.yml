name: Flutter Firebase Deploy

on:
  push:
    branches: [ dev ]
    paths:
      - 'flutter/**'
      - '.github/workflows/frontend-firebase.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.0'
        
    - name: Flutter pub get
      run: |
        cd flutter
        flutter pub get
        
    - name: Build Web
      run: |
        cd flutter
        flutter build web --release
        
    - name: Build APK (Debug for testing)
      run: |
        cd flutter
        flutter build apk --debug
        
    - name: Upload APK to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mycoach-debug-apk
        path: flutter/build/app/outputs/flutter-apk/app-debug.apk
        
    - name: Install Firebase CLI
      run: npm install -g firebase-tools
      
    - name: Deploy to Firebase Hosting  
      run: |
        cd flutter
        firebase deploy --only hosting \
          --project "${{ secrets.FIREBASE_PROJECT_ID }}" \
          --token "${{ secrets.FIREBASE_TOKEN }}" \
          --non-interactive
          
    - name: Deploy APK to Firebase App Distribution
      run: |
        cd flutter
        firebase appdistribution:distribute \
          build/app/outputs/flutter-apk/app-debug.apk \
          --app "${{ secrets.FIREBASE_APP_ID }}" \
          --token "${{ secrets.FIREBASE_TOKEN }}" \
          --groups "mycoach-testers" \
          --release-notes "Build automatique depuis commit ${{ github.sha }}" \
          --non-interactive
      continue-on-error: true