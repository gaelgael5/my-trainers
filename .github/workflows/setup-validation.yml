name: Setup Validation

on:
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type de test à exécuter'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - secrets
        - backend
        - frontend
        - firebase

jobs:
  validate-secrets:
    if: contains(fromJson('["all", "secrets"]'), github.event.inputs.test_type)
    runs-on: ubuntu-latest
    
    steps:
    - name: Validate required secrets
      run: |
        echo "🔍 Validation des secrets GitHub..."
        
        # Vérifier les secrets Firebase
        if [ -z "${{ secrets.FIREBASE_TOKEN }}" ]; then
          echo "❌ FIREBASE_TOKEN manquant"
          exit 1
        else
          echo "✅ FIREBASE_TOKEN configuré"
        fi
        
        if [ -z "${{ secrets.FIREBASE_PROJECT_ID }}" ]; then
          echo "❌ FIREBASE_PROJECT_ID manquant"
          exit 1
        else
          echo "✅ FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}"
        fi
        
        if [ -z "${{ secrets.FIREBASE_APP_ID }}" ]; then
          echo "❌ FIREBASE_APP_ID manquant"
          exit 1
        else
          echo "✅ FIREBASE_APP_ID configuré"
        fi
        
        echo "✅ Tous les secrets requis sont configurés!"

  validate-backend:
    if: contains(fromJson('["all", "backend"]'), github.event.inputs.test_type)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Validate backend structure
      run: |
        echo "🔍 Validation de la structure backend..."
        
        # Vérifier les fichiers requis
        required_files=(
          "backend/Dockerfile"
          "backend/requirements.txt" 
          "backend/app/main.py"
          "backend/app/health.py"
        )
        
        for file in "${required_files[@]}"; do
          if [ -f "$file" ]; then
            echo "✅ $file"
          else
            echo "❌ $file manquant"
            exit 1
          fi
        done
        
    - name: Test Docker build
      run: |
        echo "🐳 Test de build Docker..."
        cd backend
        docker build -t mycoach-backend-test .
        echo "✅ Docker build réussi!"
        
    - name: Test health endpoint
      run: |
        echo "🏥 Test du health check..."
        cd backend
        docker run -d -p 8000:8000 --name test-backend mycoach-backend-test
        sleep 10
        
        # Test health endpoint
        response=$(curl -f http://localhost:8000/health)
        if echo "$response" | grep -q "healthy"; then
          echo "✅ Health check OK"
        else
          echo "❌ Health check failed"
          exit 1
        fi
        
        docker stop test-backend
        docker rm test-backend

  validate-frontend:
    if: contains(fromJson('["all", "frontend"]'), github.event.inputs.test_type)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        cache: true
        
    - name: Validate Flutter project
      working-directory: flutter
      run: |
        echo "🔍 Validation du projet Flutter..."
        
        # Vérifier les fichiers requis
        required_files=(
          "pubspec.yaml"
          "lib/main.dart"
          "firebase.json"
        )
        
        for file in "${required_files[@]}"; do
          if [ -f "$file" ]; then
            echo "✅ $file"
          else
            echo "❌ $file manquant"
            exit 1
          fi
        done
        
    - name: Flutter doctor
      run: flutter doctor -v
      
    - name: Get dependencies
      working-directory: flutter
      run: flutter pub get
      
    - name: Analyze code
      working-directory: flutter
      run: flutter analyze
      
    - name: Test build APK
      working-directory: flutter
      run: |
        echo "📱 Test de build APK..."
        flutter build apk --debug
        echo "✅ APK build réussi!"
        
    - name: Test build Web
      working-directory: flutter
      run: |
        echo "🌐 Test de build Web..."
        flutter build web
        echo "✅ Web build réussi!"

  validate-firebase:
    if: contains(fromJson('["all", "firebase"]'), github.event.inputs.test_type)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Firebase CLI
      run: |
        npm install -g firebase-tools
        
    - name: Test Firebase authentication
      env:
        FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      run: |
        echo "🔥 Test d'authentification Firebase..."
        
        # Authentification avec le token
        echo "$FIREBASE_TOKEN" | firebase login:ci
        
        # Test de connexion au projet
        firebase projects:list | grep "$FIREBASE_PROJECT_ID"
        
        if [ $? -eq 0 ]; then
          echo "✅ Connexion Firebase réussie!"
        else
          echo "❌ Projet Firebase non trouvé"
          exit 1
        fi
        
    - name: Validate Firebase config
      working-directory: flutter
      run: |
        echo "🔍 Validation de la configuration Firebase..."
        
        # Vérifier firebase.json
        if [ -f "firebase.json" ]; then
          echo "✅ firebase.json trouvé"
          cat firebase.json | jq .
        else
          echo "❌ firebase.json manquant"
          exit 1
        fi

  summary:
    needs: [validate-secrets, validate-backend, validate-frontend, validate-firebase]
    if: always()
    runs-on: ubuntu-latest
    
    steps:
    - name: Setup validation summary
      run: |
        echo "📊 RÉSUMÉ DE VALIDATION"
        echo "======================="
        
        if [ "${{ needs.validate-secrets.result }}" == "success" ] || [ "${{ needs.validate-secrets.result }}" == "skipped" ]; then
          echo "✅ Secrets GitHub configurés"
        else
          echo "❌ Problème avec les secrets GitHub"
        fi
        
        if [ "${{ needs.validate-backend.result }}" == "success" ] || [ "${{ needs.validate-backend.result }}" == "skipped" ]; then
          echo "✅ Backend Docker fonctionnel"
        else
          echo "❌ Problème avec le backend"
        fi
        
        if [ "${{ needs.validate-frontend.result }}" == "success" ] || [ "${{ needs.validate-frontend.result }}" == "skipped" ]; then
          echo "✅ Frontend Flutter fonctionnel"
        else
          echo "❌ Problème avec Flutter"
        fi
        
        if [ "${{ needs.validate-firebase.result }}" == "success" ] || [ "${{ needs.validate-firebase.result }}" == "skipped" ]; then
          echo "✅ Firebase configuré correctement"
        else
          echo "❌ Problème avec Firebase"
        fi
        
        echo ""
        echo "🚀 Prêt pour les déploiements automatiques!"