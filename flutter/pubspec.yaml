#   matcher: ^0.12.18
#   test_api: ^0.7.9
#   # Build tools compatibility fixes
#   build_runner: ^2.4.13
#   json_serializable: ^6.8.0
#   source_gen: ^1.5.0
#   # Code generation fixes
#   code_builder: ^4.10.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/