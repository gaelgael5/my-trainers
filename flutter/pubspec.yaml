name: mycoach
description: "my-trainer - Personal training companion app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  bloc: ^9.2.0

  # HTTP & API
  http: ^1.1.0
  dio: ^5.3.2

  # Storage
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.2.2

  # Navigation
  auto_route: ^11.1.0

  # UI & Design
  google_fonts: ^8.0.2
  shimmer: ^3.0.0

  # Utils
  equatable: ^2.0.5
  json_annotation: ^4.11.0
  get_it: ^9.2.1
  injectable: ^2.7.1+4
  intl: ^0.20.2

  # Validation
  formz: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  # Code generation
  auto_route_generator: ^10.5.0
  json_serializable: ^6.13.0
  build_runner: ^2.12.1
  injectable_generator: ^2.12.1

# EMERGENCY FIX: dependency_overrides removed - let Flutter resolve naturally
