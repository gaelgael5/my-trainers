name: mycoach
description: "my-trainer - Personal training companion app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  bloc: ^8.1.2

  # HTTP & API
  http: ^1.1.0
  dio: ^5.3.2

  # Storage
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.2

  # Navigation
  auto_route: ^7.8.4
  go_router: ^13.2.0

  # UI & Design
  google_fonts: ^6.1.0
  shimmer: ^3.0.0

  # Utils
  equatable: ^2.0.5
  json_annotation: ^4.8.1
  get_it: ^7.6.4
  injectable: ^2.3.2
  intl: ^0.19.0

  # Validation
  formz: ^0.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  
  # Code generation
  auto_route_generator: ^7.3.2
  json_serializable: ^6.7.1
  build_runner: ^2.4.7
  injectable_generator: ^2.4.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/